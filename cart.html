<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | 4LJTek</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">

    <div class="logo">
        <a href="index.html">
            <img src="images/logo.png" alt="4LJTek">
        </a>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
    </nav>

</header>


<section class="products-section">

    <h2>Your Cart</h2>

    <p class="products-intro">
        Review the products you've selected.
    </p>


    <!-- CART ITEMS -->

    <div id="cart-items">

        <p id="empty-cart">
            Your cart is empty.
        </p>

    </div>


    <!-- CART SUMMARY -->

    <div id="cart-summary" style="display:none; margin-top:30px;">

        <h3>
            Cart Summary
        </h3>

        <p>
            Items:
            <strong id="cart-count">0</strong>
        </p>

        <p>
            Total:
            <strong id="cart-total">
                Contact for Price
            </strong>
        </p>

        <div class="product-actions">

            <button
                type="button"
                class="whatsapp-btn"
                id="cart-whatsapp"
            >
                Order via WhatsApp
            </button>

            <button
                type="button"
                class="call-btn"
                id="cart-call"
            >
                Call 4LJTek
            </button>

        </div>

        <button
            type="button"
            id="clear-cart"
            style="margin-top:15px; padding:12px 20px; border:0; border-radius:10px; cursor:pointer;"
        >
            Clear Cart
        </button>

    </div>

</section>


<footer>

    <p>
        © 2026 4LJTek. All Rights Reserved.
    </p>

</footer>


<script src="js/script.js"></script>

</body>

</html>
