<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4LJTek | Premium Electronics</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#fff;
color:#111;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:#000;
color:#fff;
}

.logo{
font-size:32px;
font-weight:800;
}

nav a{
color:#fff;
text-decoration:none;
margin-left:25px;
font-weight:600;
}

.hero{
height:90vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
background:#000;
color:#fff;
}

.hero h1{
font-size:60px;
margin-bottom:20px;
}

.hero p{
font-size:20px;
max-width:650px;
opacity:.8;
}

.hero button{
margin-top:35px;
padding:16px 40px;
font-size:18px;
border:none;
background:#fff;
color:#000;
cursor:pointer;
font-weight:bold;
border-radius:50px;
}

.products{
padding:80px 8%;
}

.products h2{
text-align:center;
font-size:40px;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:30px;
}

.card{
background:#f6f6f6;
border-radius:18px;
padding:25px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:200px;
object-fit:contain;
}

.card h3{
margin:20px 0 10px;
}

.card button{
padding:12px 28px;
background:#000;
color:#fff;
border:none;
border-radius:30px;
cursor:pointer;
}

footer{
background:#000;
color:#fff;
text-align:center;
padding:40px;
margin-top:70px;
}
</style>

</head>

<body>

<header>

<div class="logo">
4LJTek
</div>

<nav>

<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

<a href="cart.html">Cart</a>

</nav>

</header>

<section class="hero">

<h1>Premium Electronics.</h1>

<p>Discover iPhones, Samsung, PlayStation, TVs and Accessories at unbeatable prices.</p>

<button onclick="location.href='products.html'">
Shop Now
</button>

</section>

<section class="products">

<h2>Featured Categories</h2>

<div class="grid">

<div class="card">
<img src="images/iphone.png">
<h3>iPhone</h3>
<button>View</button>
</div>

<div class="card">
<img src="images/samsung.png">
<h3>Samsung</h3>
<button>View</button>
</div>

<div class="card">
<img src="images/playstation.png">
<h3>PlayStation</h3>
<button>View</button>
</div>

<div class="card">
<img src="images/tv.png">
<h3>Smart TVs</h3>
<button>View</button>
</div>

</div>

</section>

<footer>

<h2>4LJTek</h2>

<p>Quality Over Quantity</p>

<p>© 2026 4LJTek. All Rights Reserved.</p>

</footer>

</body>
</html>
