<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | 4LJTek</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==========================================
           CHECKOUT PAGE
        ========================================== */

        .checkout-page {

            max-width: 1200px;

            margin: 0 auto;

            padding:
                70px 24px 90px;
        }


        /* ==========================================
           HERO
        ========================================== */

        .checkout-hero {

            margin-bottom:
                45px;
        }


        .checkout-hero h1 {

            font-size:
                56px;

            font-weight:
                800;

            line-height:
                1;

            letter-spacing:
                -3px;

            margin:
                0 0 15px;
        }


        .checkout-hero p {

            margin:
                0;

            color:
                #777;

            font-size:
                18px;
        }


        /* ==========================================
           LAYOUT
        ========================================== */

        .checkout-layout {

            display:
                grid;

            grid-template-columns:
                1.4fr .8fr;

            gap:
                30px;

            align-items:
                start;
        }


        /* ==========================================
           FORM
        ========================================== */

        .checkout-form-card {

            background:
                #fff;

            border:
                1px solid #ddd;

            border-radius:
                26px;

            padding:
                35px;
        }


        .checkout-form-card h2 {

            margin:
                0 0 30px;

            font-size:
                30px;

            font-weight:
                800;
        }


        .form-group {

            margin-bottom:
                23px;
        }


        .form-group label {

            display:
                block;

            font-size:
                16px;

            font-weight:
                700;

            margin-bottom:
                10px;
        }


        .form-group label span {

            color:
                #e00000;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {

            width:
                100%;

            box-sizing:
                border-box;

            padding:
                16px 18px;

            border:
                1px solid #ccc;

            border-radius:
                14px;

            background:
                #fff;

            color:
                #111;

            font-family:
                inherit;

            font-size:
                16px;

            outline:
                none;

            transition:
                .2s ease;
        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {

            border-color:
                #111;

            box-shadow:
                0 0 0 3px rgba(0,0,0,.06);
        }


        .form-group textarea {

            min-height:
                130px;

            resize:
                vertical;
        }


        /* ==========================================
           PLACE ORDER
        ========================================== */

        .place-order-btn {

            width:
                100%;

            border:
                0;

            border-radius:
                14px;

            padding:
                18px;

            background:
                #25D366;

            color:
                #fff;

            font-family:
                inherit;

            font-size:
                18px;

            font-weight:
                800;

            cursor:
                pointer;

            transition:
                .2s ease;
        }


        .place-order-btn:hover {

            transform:
                translateY(-2px);

            background:
                #1fbd5b;
        }


        /* ==========================================
           ORDER SUMMARY
        ========================================== */

        .checkout-summary {

            background:
                #111;

            color:
                #fff;

            border-radius:
                26px;

            padding:
                32px;

            position:
                sticky;

            top:
                25px;
        }


        .checkout-summary h2 {

            margin:
                0 0 25px;

            font-size:
                32px;

            font-weight:
                800;
        }


        #checkout-items {

            margin-bottom:
                20px;
        }


        .checkout-item {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                20px;

            padding:
                17px 0;

            border-bottom:
                1px solid rgba(255,255,255,.14);
        }


        .checkout-item-name {

            font-size:
                15px;

            line-height:
                1.5;
        }


        .checkout-item-price {

            font-size:
                15px;

            font-weight:
                700;

            white-space:
                nowrap;
        }


        /* ==========================================
           TOTAL
        ========================================== */

        .checkout-total {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            padding-top:
                24px;

            margin-top:
                10px;

            border-top:
                1px solid rgba(255,255,255,.2);
        }


        .checkout-total span {

            font-size:
                19px;

            font-weight:
                600;
        }


        .checkout-total strong {

            font-size:
                25px;

            font-weight:
                800;
        }


        /* ==========================================
           BACK TO CART
        ========================================== */

        .back-cart {

            display:
                block;

            margin-top:
                25px;

            text-align:
                center;

            color:
                #aaa;

            text-decoration:
                none;

            font-size:
                15px;
        }


        .back-cart:hover {

            color:
                #fff;
        }


        /* ==========================================
           EMPTY CHECKOUT
        ========================================== */

        .empty-checkout {

            text-align:
                center;

            padding:
                30px 10px;

            color:
                #aaa;
        }


        .empty-checkout a {

            display:
                inline-block;

            margin-top:
                18px;

            padding:
                12px 20px;

            border-radius:
                11px;

            background:
                #fff;

            color:
                #111;

            text-decoration:
                none;

            font-weight:
                700;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 800px) {

            .checkout-page {

                padding:
                    50px 17px 70px;
            }


            .checkout-hero {

                margin-bottom:
                    30px;
            }


            .checkout-hero h1 {

                font-size:
                    43px;

                letter-spacing:
                    -2px;
            }


            .checkout-hero p {

                font-size:
                    16px;

                line-height:
                    1.5;
            }


            .checkout-layout {

                grid-template-columns:
                    1fr;

                gap:
                    22px;
            }


            .checkout-form-card {

                padding:
                    25px 18px;

                border-radius:
                    21px;
            }


            .checkout-form-card h2 {

                font-size:
                    26px;
            }


            .checkout-summary {

                padding:
                    25px 20px;

                border-radius:
                    22px;

                position:
                    static;
            }


            .checkout-summary h2 {

                font-size:
                    29px;
            }


            .checkout-item {

                gap:
                    12px;
            }


            .checkout-item-name,
            .checkout-item-price {

                font-size:
                    14px;
            }


            .checkout-total strong {

                font-size:
                    21px;
            }


            .place-order-btn {

                font-size:
                    17px;

                padding:
                    17px;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header class="site-header">

    <div class="logo">

        <a href="index.html">

            <img
                src="images/logo.png"
                alt="4LJTek"
            >

        </a>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="cart.html">
            Cart
        </a>

    </nav>

</header>


<!-- ==========================================
     CHECKOUT
========================================== -->

<main class="checkout-page">


    <section class="checkout-hero">

        <h1>
            Checkout
        </h1>

        <p>
            Complete your details and place your order via WhatsApp.
        </p>

    </section>


    <div class="checkout-layout">


        <!-- ======================================
             CUSTOMER DETAILS
        ======================================= -->

        <section class="checkout-form-card">

            <h2>
                Delivery Details
            </h2>


            <form id="checkout-form">


                <div class="form-group">

                    <label for="customer-name">
                        Full Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="e.g. John Kamau"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="customer-phone">
                        Phone Number <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="e.g. 0712345678"
                        autocomplete="tel"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="delivery-location">
                        Delivery Location <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="delivery-location"
                        placeholder="e.g. Nairobi CBD"
                        autocomplete="street-address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="delivery-method">
                        Delivery / Collection
                    </label>

                    <select id="delivery-method">

                        <option value="Delivery">
                            Delivery
                        </option>

                        <option value="Collection">
                            Collection
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="order-notes">
                        Order Notes
                    </label>

                    <textarea
                        id="order-notes"
                        placeholder="Any additional details..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="place-order-btn"
                >
                    Place Order via WhatsApp
                </button>


            </form>

        </section>


        <!-- ======================================
             ORDER SUMMARY
        ======================================= -->

        <aside class="checkout-summary">


            <h2>
                Your Order
            </h2>


            <!--
                script.js automatically fills
                this section with the cart items.
            -->

            <div id="checkout-items">

                <div class="empty-checkout">
                    Loading your order...
                </div>

            </div>


            <div class="checkout-total">

                <span>
                    Total
                </span>

                <strong id="checkout-total">
                    KSh 0
                </strong>

            </div>


            <a
                href="cart.html"
                class="back-cart"
            >
                ← Back to Cart
            </a>


        </aside>


    </div>

</main>


<!-- ==========================================
     FOOTER
========================================== -->

<footer>

    <p>
        © 2026 4LJTek. All Rights Reserved.
    </p>

</footer>


<!--
    IMPORTANT:
    Only the new central script.js is loaded.
    There is NO duplicate checkout JavaScript here.
-->

<script src="js/script.js?v=12"></script>


</body>

            </html>
