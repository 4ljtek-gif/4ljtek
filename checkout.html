<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | 4LJTek</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =====================================================
           CHECKOUT PAGE
        ===================================================== */

        .checkout-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 24px 80px;
        }

        .checkout-hero {
            text-align: center;
            margin-bottom: 45px;
        }

        .checkout-hero h1 {
            font-size: 48px;
            margin: 0 0 12px;
            font-weight: 800;
        }

        .checkout-hero p {
            margin: 0;
            color: #777;
            font-size: 17px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.4fr .8fr;
            gap: 30px;
            align-items: start;
        }

        .checkout-form-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 28px;
            padding: 35px;
        }

        .checkout-form-card h2 {
            margin: 0 0 30px;
            font-size: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .form-group label span {
            color: #e00000;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 17px 20px;
            border: 1px solid #ccc;
            border-radius: 16px;
            background: #fff;
            font-family: inherit;
            font-size: 17px;
            outline: none;
            transition: .2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0,0,0,.06);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .place-order-btn {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 20px;
            background: #25d366;
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s ease;
        }

        .place-order-btn:hover {
            transform: translateY(-2px);
            background: #1fbd5b;
        }

        /* =====================================================
           ORDER SUMMARY
        ===================================================== */

        .checkout-summary {
            background: #111;
            color: #fff;
            border-radius: 30px;
            padding: 35px;
            position: sticky;
            top: 25px;
        }

        .checkout-summary h2 {
            margin: 0 0 28px;
            font-size: 34px;
            font-weight: 800;
        }

        .checkout-items {
            margin-bottom: 25px;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255,255,255,.15);
        }

        .checkout-item-name {
            font-size: 16px;
            line-height: 1.5;
        }

        .checkout-item-price {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
        }

        .checkout-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-top: 25px;
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,.2);
        }

        .checkout-total span:first-child {
            font-size: 20px;
        }

        .checkout-total strong {
            font-size: 26px;
        }

        .back-cart {
            display: block;
            margin-top: 28px;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 16px;
        }

        .back-cart:hover {
            color: #fff;
        }

        .empty-checkout {
            text-align: center;
            padding: 30px 10px;
            color: #aaa;
        }

        .empty-checkout a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 20px;
            border-radius: 12px;
            background: #fff;
            color: #111;
            text-decoration: none;
            font-weight: 700;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .checkout-page {
                padding: 35px 16px 60px;
            }

            .checkout-hero {
                margin-bottom: 30px;
            }

            .checkout-hero h1 {
                font-size: 36px;
            }

            .checkout-hero p {
                font-size: 15px;
            }

            .checkout-layout {
                grid-template-columns: 1fr;
                gap: 22px;
            }

            .checkout-form-card {
                padding: 24px 18px;
                border-radius: 22px;
            }

            .checkout-form-card h2 {
                font-size: 26px;
            }

            .checkout-summary {
                padding: 26px 22px;
                border-radius: 26px;
                position: static;
            }

            .checkout-summary h2 {
                font-size: 32px;
            }

            .checkout-item {
                gap: 12px;
            }

            .checkout-item-name,
            .checkout-item-price {
                font-size: 14px;
            }

            .checkout-total strong {
                font-size: 22px;
            }

            .place-order-btn {
                font-size: 18px;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img src="images/logo.png" alt="4LJTek Logo">
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>
</header>


<main class="checkout-page">

    <section class="checkout-hero">
        <h1>Checkout</h1>
        <p>Complete your details and place your order via WhatsApp.</p>
    </section>


    <div class="checkout-layout">

        <!-- =================================================
             CUSTOMER DETAILS
        ================================================== -->

        <section class="checkout-form-card">

            <h2>Delivery Details</h2>

            <form id="checkout-form">

                <div class="form-group">
                    <label for="customer-name">
                        Full Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="e.g. John Kamau"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="customer-phone">
                        Phone Number <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="e.g. 0712345678"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="delivery-location">
                        Delivery Location <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="delivery-location"
                        placeholder="e.g. Nairobi CBD"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="delivery-method">
                        Delivery / Collection
                    </label>

                    <select id="delivery-method">
                        <option value="Delivery">Delivery</option>
                        <option value="Collection">Collection</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="order-notes">
                        Order Notes
                    </label>

                    <textarea
                        id="order-notes"
                        placeholder="Any additional details..."
                    ></textarea>
                </div>


                <button
                    type="submit"
                    class="place-order-btn"
                >
                    Place Order via WhatsApp
                </button>

            </form>

        </section>


        <!-- =================================================
             ORDER SUMMARY
        ================================================== -->

        <aside class="checkout-summary">

            <h2>Your Order</h2>

            <div id="checkout-items">
                <!-- JavaScript fills this -->
            </div>

            <div class="checkout-total">

                <span>Total</span>

                <strong id="checkout-total">
                    Contact for Price
                </strong>

            </div>

            <a href="cart.html" class="back-cart">
                ← Back to Cart
            </a>

        </aside>

    </div>

</main>


<!-- =====================================================
     MAIN WEBSITE JAVASCRIPT
====================================================== -->

<script src="js/script.js?v=9"></script>


<script>
/* =========================================================
   CHECKOUT PAGE JAVASCRIPT
   Uses the same cart + pricing system as script.js
========================================================= */

(function () {

    const checkoutItems = document.getElementById("checkout-items");
    const checkoutTotal = document.getElementById("checkout-total");
    const checkoutForm = document.getElementById("checkout-form");

    function loadCheckout() {

        if (!checkoutItems || !checkoutTotal) return;

        const cart = getCart();

        if (!cart || cart.length === 0) {

            checkoutItems.innerHTML = `
                <div class="empty-checkout">
                    Your cart is empty.
                    <br>
                    <a href="products.html">Shop Products</a>
                </div>
            `;

            checkoutTotal.textContent = "KSh 0";

            if (checkoutForm) {
                checkoutForm.style.display = "none";
            }

            return;
        }

        let total = 0;

        checkoutItems.innerHTML = "";

        cart.forEach(function (item) {

            const details = getCartItemDetails(item);

            const productName = details.productName;
            const storage = details.storage;

            const quantity = Number(item.quantity || 1);

            const unitPrice = getProductPrice(
                productName,
                storage
            );

            let itemTotal = null;

            if (unitPrice !== null) {
                itemTotal = unitPrice * quantity;
                total += itemTotal;
            }

            const displayName = storage
                ? productName + " — " + storage
                : productName;

            const priceText = itemTotal !== null
                ? formatPrice(itemTotal)
                : "Contact for Price";

            const itemElement = document.createElement("div");

            itemElement.className = "checkout-item";

            itemElement.innerHTML = `
                <div class="checkout-item-name">
                    ${displayName} ×${quantity}
                </div>

                <div class="checkout-item-price">
                    ${priceText}
                </div>
            `;

            checkoutItems.appendChild(itemElement);
        });


        if (total > 0) {

            checkoutTotal.textContent =
                formatPrice(total);

        } else {

            checkoutTotal.textContent =
                "Contact for Price";
        }
    }


    /* =====================================================
       PLACE ORDER VIA WHATSAPP
    ====================================================== */

    if (checkoutForm) {

        checkoutForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const cart = getCart();

            if (!cart || cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }


            const customerName =
                document.getElementById("customer-name").value.trim();

            const customerPhone =
                document.getElementById("customer-phone").value.trim();

            const deliveryLocation =
                document.getElementById("delivery-location").value.trim();

            const deliveryMethod =
                document.getElementById("delivery-method").value;

            const orderNotes =
                document.getElementById("order-notes").value.trim();


            if (!customerName ||
                !customerPhone ||
                !deliveryLocation) {

                alert("Please fill in all required fields.");
                return;
            }


            let message =
                "Hi 4LJTek, I'd like to place an order.%0A%0A";


            message +=
                "CUSTOMER DETAILS%0A";

            message +=
                "Name: " +
                encodeURIComponent(customerName) +
                "%0A";

            message +=
                "Phone: " +
                encodeURIComponent(customerPhone) +
                "%0A";

            message +=
                "Location: " +
                encodeURIComponent(deliveryLocation) +
                "%0A";

            message +=
                "Method: " +
                encodeURIComponent(deliveryMethod) +
                "%0A%0A";


            message += "ORDER%0A";


            let total = 0;


            cart.forEach(function (item) {

                const details =
                    getCartItemDetails(item);

                const productName =
                    details.productName;

                const storage =
                    details.storage;

                const quantity =
                    Number(item.quantity || 1);

                const unitPrice =
                    getProductPrice(
                        productName,
                        storage
                    );

                const label = storage
                    ? productName + " — " + storage
                    : productName;


                message +=
                    "• " +
                    encodeURIComponent(label) +
                    " x" +
                    quantity;


                if (unitPrice !== null) {

                    const itemTotal =
                        unitPrice * quantity;

                    total += itemTotal;

                    message +=
                        " — " +
                        encodeURIComponent(
                            formatPrice(itemTotal)
                        );
                }


                message += "%0A";
            });


            message += "%0A";


            if (total > 0) {

                message +=
                    "TOTAL: " +
                    encodeURIComponent(
                        formatPrice(total)
                    ) +
                    "%0A";

            } else {

                message +=
                    "TOTAL: Contact for Price%0A";
            }


            if (orderNotes) {

                message +=
                    "Order Notes: " +
                    encodeURIComponent(orderNotes) +
                    "%0A";
            }


            message +=
                "%0APlease confirm availability and delivery details.";


            const whatsappUrl =
                "https://api.whatsapp.com/send?phone=254101984723&text=" +
                message;


            window.location.href = whatsappUrl;
        });
    }


    /* =====================================================
       INITIALIZE
    ====================================================== */

    loadCheckout();

})();
</script>

</body>
</html>
